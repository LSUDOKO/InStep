      // ---- labels on the connectors: [x, y, html, colour, at, extra class] ---------------------
      const camOff =
        '<svg viewBox="0 0 24 24" fill="none" stroke="#B8325A" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5zM3 3l18 18"/></svg>';
      const LABELS = [
        [580, 178, '<b>body points</b> · JSON<br>≈1 KB/frame, ≤30/s<br>(WebSocket)', C.sky, 8.3],
        [580, 291, '<b>gate state · tips</b>', C.iris, 8.5],
        [580, 335, `${camOff}never video`, '#D94F76', 8.7, 'never'],
        [1340, 180, '<b>body points</b><br>to the TV only', C.sky, 8.9],
        [1340, 294, '<b>gate state · result</b>', C.iris, 9.1],
        [1340, 342, 'lesson + .istep + video<br>(HTTPS)', C.grey, 9.3],
        [1340, 428, 'coach · session<br>numbers only', C.grey, 9.5],
        [600, 540, 'demo video +<br>reference.json<br>(instructor only)', C.grey, 9.7],
        [837, 571, 'loaded at start', C.grey, 9.9, 'left'],
        [1107, 571, 'off', C.grey, 10.0, 'left'],
        [1578, 302, 'pause · play', C.iris, 10.1, 'left'],
      ];
      document.getElementById('labels').innerHTML = LABELS.map(
        ([x, y, html, color, at, cls = '']) =>
          `<div class="pill ${cls}" style="left:${x}px;top:${y}px;--c:${color}" data-at="${at}">${html}</div>`,
      ).join('');

      // ---- "one gate, step by step": numbered markers on the diagram + legend -----------------
      const STEPS = [
        [1532, 302, 'Video reaches the gate → pause', 'controller tick ≤ 100 ms'],
        [492, 228, 'Phone streams body points', 'relay → TV only, ≤ 30 a second'],
        [1856, 288, 'Engine scores every frame', 'HUD ring, skeleton, Delta Glow'],
        [1420, 470, 'Stuck? One short coach tip', 'templated, cached, as a caption'],
        [1236, 266, 'Pass → gate_result → resume', 'the phone plays a chime'],
        [1440, 228, 'No body points for 2 s → pause', '"Camera disconnected"'],
      ];
      document
        .getElementById('labels')
        .insertAdjacentHTML(
          'beforeend',
          STEPS.map(
            ([x, y], i) =>
              `<div class="mark" style="left:${x}px;top:${y}px" data-at="${10.4 + i * 0.15}" data-hl="${i}">${i + 1}</div>`,
          ).join(''),
        );
      const keyLine = (color, dashed) =>
        `<svg viewBox="0 0 40 12"><path d="M1 6h30" stroke="${color}" stroke-width="2.5" ${dashed ? 'stroke-dasharray="6 5"' : ''}/><path d="M39 6l-9-4.5v9z" fill="${color}"/></svg>`;
      document.getElementById('legend').innerHTML = STEPS.map(
        ([, , b, small], i) =>
          `<div class="step" data-at="${10.5 + i * 0.15}" data-hl="${i}"><div class="mark">${i + 1}</div><div><b>${b}</b><small>${small}</small></div></div>`,
      ).join('');
      document.getElementById('key').innerHTML = `
          <div>${keyLine(C.skyL)}body points (WebSocket)</div><div>${keyLine(C.iris)}gate state · tips</div>
          <div>${keyLine(C.grey)}HTTPS</div><div>${keyLine(C.grey, true)}switched off</div>`;

      // ---- packets: body points phone → relay → TV (sky), gate state TV → relay → phone (iris) --
      const packet = (color) => {
        const g = mk('g', {});
        mk('circle', { r: 11, fill: color, opacity: 0.2 }, g);
        mk('circle', { r: 6, fill: color, stroke: '#fff', 'stroke-width': 2 }, g);
        return g;
      };
      const FLOWS = [
        { route: ['e1', 'e3'], color: C.skyL, n: 2, period: 2, start: 11.6 },
        { route: ['e4', 'e2'], color: C.iris, n: 1, period: 3, start: 12.1 },
      ].map((f) => ({ ...f, dots: Array.from({ length: f.n }, () => packet(f.color)) }));

      const clamp = (x) => Math.max(0, Math.min(1, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const items = [...document.querySelectorAll('[data-at]')];
      const hls = [...document.querySelectorAll('[data-hl]')];

      function seek(t) {
        for (const el of items) {
          const e = ease((t - Number(el.dataset.at)) / 0.5);
          el.style.opacity = e.toFixed(3);
          el.style.transform = e < 1 ? `translateY(${((1 - e) * 12).toFixed(2)}px)` : '';
        }
        for (const ed of edges) {
          const e = ease((t - ed.at) / 0.6);
          ed.reveal.setAttribute('stroke-dashoffset', (ed.len * (1 - e)).toFixed(2));
          ed.head.setAttribute('opacity', clamp((e - 0.85) / 0.15).toFixed(3));
        }
        for (const f of FLOWS) {
          const on = ease((t - f.start) / 0.5);
          // each dot runs the first edge (0–0.42), hides inside the relay (0.42–0.58), runs the second
          f.dots.forEach((dot, i) => {
            const u = ((((t - f.start) / f.period + i / f.n) % 1) + 1) % 1;
            let ed, k;
            if (u < 0.42) [ed, k] = [byId[f.route[0]], u / 0.42];
            else if (u > 0.58) [ed, k] = [byId[f.route[1]], (u - 0.58) / 0.42];
            const fade = ed ? clamp(Math.min(k / 0.1, (1 - k) / 0.1)) : 0;
            dot.setAttribute('opacity', (t < f.start ? 0 : on * fade).toFixed(3));
            if (ed) {
              const p = ed.path.getPointAtLength(ed.len * k);
              dot.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
            }
          });
        }
        // after settling, walk through the six steps (marker + legend row), 1 s each
        hls.forEach((el) => {
          const i = Number(el.dataset.hl);
          let w = 0;
          if (t >= HL_START) {
            const x = (t - HL_START) / HL_STEP - i;
            const xm = ((x % 6) + 6) % 6;
            w = xm < 1 ? Math.min(clamp(xm / 0.2), clamp((1 - xm) / 0.2)) : 0;
          }
          if (el.classList.contains('mark'))
            el.style.background = w ? `color-mix(in srgb, ${C.iris} ${(w * 100).toFixed(0)}%, ${C.ink})` : '';
          else el.style.background = w ? `rgba(138, 109, 255, ${(0.14 * w).toFixed(3)})` : '';
        });
      }

      window.seek = seek;
      window.SETTLED = SETTLED;
      window.TIMELINE = {
        header: 0,
        swimlanes: 0.3,
        components: 1.6,
        connectors: 4.5,
        labels: 8.3,
        markers: 10.4,
        legend: 10.5,
        packets: 11.6,
        gateStateBack: 12.1,
        settled: SETTLED,
        highlightLoop: HL_START,
        loop: [HL_START, HL_START + 6],
      };

      const q = new URLSearchParams(location.search);
      seek(q.has('t') ? Number(q.get('t')) : SETTLED);
      if (q.has('play')) {
        let t0;
        const frame = (now) => {
          t0 ??= now;
          seek((now - t0) / 1000);
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }
    </script>
  </body>
</html>
