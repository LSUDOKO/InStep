<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>InStep animated demonstrations (fall prevention, hand rehab)</title>
    <style>
      @font-face {
        font-family: Inter;
        font-weight: 100 900;
        src: url('/apps/companion/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
      }
      html, body { margin: 0; background: #000; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script src="kit.js"></script>
    <script src="room.js"></script>
    <script src="figure.js"></script>
    <script src="hand.js"></script>
    <script src="lessons.js"></script>
    <script>
      // Served from the repo root by render.py. Open /scripts/motion/fall-rehab/scene.html?lesson=<id>&t=<sec> to look.
      (async () => {
        const P = await (await fetch('/docs/brand/palette.json')).json();
        await document.fonts.load(`700 40px Inter`).catch(() => {});
        const canvas = document.getElementById('c');
        const c = canvas.getContext('2d');
        window.__canvas = canvas;
        window.renderFrame = (lesson, t) => {
          c.setTransform(canvas.width / K.W, 0, 0, canvas.height / K.H, 0, 0);
          LESSONS[lesson].draw(c, P, t);
        };
        const q = new URLSearchParams(location.search);
        if (q.get('lesson')) window.renderFrame(q.get('lesson'), +(q.get('t') || 0));
        window.__ready = true;
      })().catch((e) => ((window.__bootFailed = String(e.stack || e)), console.error(e)));
    </script>
  </body>
</html>
