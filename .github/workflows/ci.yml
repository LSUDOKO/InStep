name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (with coverage)
        run: pnpm test:coverage
      - name: Validate .istep examples
        run: |
          pnpm --filter @instep/istep-format build
          node packages/istep-format/bin/istep.mjs validate packages/istep-format/examples/*.istep
          ! node packages/istep-format/bin/istep.mjs validate packages/istep-format/invalid/*.istep
