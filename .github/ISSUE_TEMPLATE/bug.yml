name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [TV app (Vega), Companion (camera), Creator Studio, Server, gate-engine, istep-format, Docs]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open lesson …\n2. …"
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Vega Virtual Device 0.24 / Chrome 140 on Pixel 7 / Node 22
