name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: ffmpeg (server transcode tests)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (with coverage)
        run: pnpm test:coverage
      - name: Validate .istep examples
        run: |
          pnpm --filter @instep/istep-format build
          node packages/istep-format/bin/istep.mjs validate packages/istep-format/examples/*.istep
          ! node packages/istep-format/bin/istep.mjs validate packages/istep-format/invalid/*.istep

  e2e:
    name: Companion e2e (Playwright, fake camera)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: ffmpeg (Creator Studio transcode)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pnpm install --frozen-lockfile
      - name: Cache MediaPipe models
        uses: actions/cache@v4
        with:
          path: apps/companion/public/models
          key: mediapipe-models-${{ hashFiles('apps/companion/scripts/fetch-models.mjs') }}
      - run: pnpm companion:build
      - run: pnpm --filter @instep/companion exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/companion/test-results

  tv:
    name: TV app (Vega) typecheck + Metro bundle
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/tv/package-lock.json
      - run: pnpm install --frozen-lockfile # shared packages' own deps (zod)
      - run: npm ci --no-audit --no-fund
        working-directory: apps/tv
      - run: npm run typecheck
        working-directory: apps/tv
      - name: Metro bundle (catches syntax/resolution problems without the Vega SDK)
        working-directory: apps/tv
        run: npx react-native bundle --entry-file index.js --platform kepler --dev false --bundle-output /tmp/instep-tv.js --assets-dest /tmp/instep-tv-assets
