name: Keep hosted server warm

# Render's free plan sleeps a service after 15 minutes without traffic; waking takes up to a minute and
# drops the first requests. A light health ping every 10 minutes keeps the demo server responsive.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 2 https://instep-wfcr.onrender.com/api/health
